version: '3.4'

services:

  local-postgres:
    image: postgres
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    networks:
      - local

  local-pgadmin:
    image: dpage/pgadmin4
    container_name: local-pgadmin
    ports:
      - 5434:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@local.com
      - PGADMIN_DEFAULT_PASSWORD=password
    networks:
      - local

  local-seq:
    image: datalust/seq
    container_name: local-seq
    ports:
      - "5030:80"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - local

  local-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: local-keycloak
    ports:
      - "8443:8443"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8443
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/server.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/server.key
    volumes:
      - ./ssl/local.keycloak.crt:/opt/keycloak/conf/server.crt
      - ./ssl/local.keycloak.key:/opt/keycloak/conf/server.key
    networks:
      - local
    command: [ "start-dev" ]

networks:
    local: